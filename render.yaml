services:
  - type: web
    name: greenlight-worker
    runtime: node
    plan: starter
    rootDir: apps/worker
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @greenlight/worker build
    startCommand: pnpm --filter @greenlight/worker start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
